<div class="topbar">

    <span class="topbar__item topbar__hours"><svg class="i" aria-hidden="true"><use href="assets/img/icons.svg#clock"/></svg>{{site.hours}}</span>
  </div>
</div>

    <a class="brand" href="index.html" aria-label="{{site.name}} — home">

      <span class="brand__text"><span class="brand__the">The</span> King's Electric</span>
    </a>

    <nav class="nav" id="site-nav" aria-label="Main">
      <ul class="nav__list">
        <li><a href="index.html" data-nav="index">Home</a></li>

          <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="services-menu" data-nav="services">

          </button>
          <ul class="nav__menu" id="services-menu">

        </li>
        <li><a href="team.html" data-nav="team">The Team</a></li>
        <li><a href="careers.html" data-nav="careers">Careers</a></li>
